# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# NOTE: Avoid -XX:MaxMetaspaceSize / aggressive tuning — on Windows Gradle 8.6
# treats any non-trivial JVM args as a "non-default JVM" and forces a single-use
# daemon fork, which prolongs file handle lifetime and triggers the infamous
# "Could not move temporary workspace .../dependencies-accessors" race condition.
# JVM args are consolidated at the bottom of this file (L94) with all native/tmp flags.

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=false

# Workaround: Gradle 8.6+ on Windows often fails with
# "Could not move temporary workspace .../dependencies-accessors/... to immutable location"
# Disabling file system watching and stable configuration cache reduces file locking issues.
org.gradle.vfs.watch=false
org.gradle.unsafe.configuration-cache=false
org.gradle.caching=false

# Reanimated / AGP 8.2.1 only officially supports compileSdk up to 34.
# Some libraries force compileSdk = 35; suppress the harmless warning so the
# build output stays clean.
android.suppressUnsupportedCompileSdk=35
# Disable daemon to release file handles immediately after build.
org.gradle.daemon=false
# Force Gradle to write JARs/classes to a temp location first and avoid
# concurrent scans breaking the "rename temp -> immutable" step.
org.gradle.internal.model.caching=false
# Hint to Gradle's version-catalog accessors generator:
# skip the default accessors persistence step entirely (helps on Windows).
systemProp.org.gradle.internal.accessors.generation.cache=false
# On Windows, the default project-cache-dir (android/.gradle) lives under the
# project folder which is aggressively scanned by Windows Defender / Search
# Indexer, leading to the persistent
#   "Could not move temporary workspace .../dependencies-accessors/... to immutable location"
# failure in Gradle 8.x.
#
# Additionally, java.io.tmpdir / %LOCALAPPDATA% can resolve to the 8.3 "short"
# alias of the current user profile folder (e.g. "C:\Users\USER~1\...") —
# Gradle then fails with:
#   "Failed to create parent directory 'C:\Users\USER~1'"
# because the short-name folder is NOT an actual directory on disk.
#
# NUCLEAR FIX (100% reliable):  Relocate all Gradle caches OUTSIDE of the
# user profile entirely. We use a literal folder chosen by the user:
#     C:\Ethan\cache\...
# which is a real long-path folder, NEVER an 8.3 short-name alias like
# "C:\Users\USER~1" (which Gradle cannot mkdir), AND Windows Defender scans
# far less aggressively than %USERPROFILE%.
#
# The same paths are also set in settings.gradle (official Groovy API,
# evaluated in the earliest phase) AND in build-android.ps1 (official CLI
# flag). Triple safety.
org.gradle.project.cache.dir=C:/Ethan/cache/gradle_project
org.gradle.build-cache-dir=C:/Ethan/cache/gradle_build
systemProp.gradle.user.home=C:/Ethan/cache/gradle_user_home

# --- native-platform.dll failure fix (Windows 11) ---
systemProp.org.gradle.native=false
org.gradle.jvmargs=-Xmx2g -Dorg.gradle.native=false -Djava.io.tmpdir=C:/Ethan/cache/jvm_tmp

# Network tolerance: Google Maven downloads can be slow / unstable on Windows.
# Give dependency resolution more time before Gradle aborts with Read timed out.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
